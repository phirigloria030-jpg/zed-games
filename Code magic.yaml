workflows:
  android-workflow:
    name: Zed Games Build
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK with Ads
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - phirigloria030@gmail.com
