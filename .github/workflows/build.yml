name: Build Zed Games APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Fix missing assets folders
        run: |
          mkdir -p assets/sounds
          mkdir -p assets/images
          touch assets/sounds/.keep
          touch assets/images/.keep
      - name: Fix Android v1 Embedding
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name zed_games --org com.example
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
