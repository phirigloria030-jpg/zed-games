name: Build Zed Games APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
      - name: Fix missing folders
        run: |
          mkdir -p assets/sounds assets/images lib
          touch assets/sounds/.keep
      - name: Clean and Recreate Android
        run: |
          rm -rf android
          flutter create . --platforms android
      - name: Add AdMob
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "APPLICATION_ID" $MANIFEST || sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' $MANIFEST
      - name: Pub Get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
