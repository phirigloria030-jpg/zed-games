name: Build Zed Games APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Save real games and fix broken manifest
        run: |
          mkdir -p /tmp/save
          cp -r lib /tmp/save/ || true
          cp pubspec.yaml /tmp/save/ || true
          cp -r assets /tmp/save/ || true
          rm -rf android
          flutter create . --project-name zed_games --org com.zedgames.app --platforms android
          rm -rf lib
          cp -r /tmp/save/lib .
          cp /tmp/save/pubspec.yaml . || true
          cp -r /tmp/save/assets . || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zed-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
