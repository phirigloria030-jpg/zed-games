name: Build ZED GAMES APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Build APK with games
        run: |
          mkdir -p assets/sounds
          echo "placeholder" > assets/sounds/placeholder.txt
          cp lib/main.dart /tmp/my_games.dart
          cp pubspec.yaml /tmp/my_pubspec.yaml
          flutter create . --project-name zed_games --platforms=android --overwrite
          cp /tmp/my_games.dart lib/main.dart
          cp /tmp/my_pubspec.yaml pubspec.yaml
          sed -i 's/compileSdkVersion.*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdk 35/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/targetSdk .*/targetSdk 35/' android/app/build.gradle || true
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZED-GAMES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
