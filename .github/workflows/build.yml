name: Build ZED GAMES APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Fix folders and Build APK
        run: |
          mkdir -p assets/sounds
          echo "placeholder" > assets/sounds/placeholder.txt
          flutter create . --project-name zed_games --platforms=android --overwrite
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZED-GAMES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
