name: Build Zed Games APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Fix missing assets
        run: |
          mkdir -p assets/sounds assets/images
          touch assets/sounds/.keep assets/images/.keep
      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name zed_games --org com.example
      - name: Add AdMob ID and Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' $MANIFEST
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' $MANIFEST
          cat $MANIFEST
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
