name: Build Zed Games APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Keep your games and fix crash + logo
        run: |
          cp lib/main.dart /tmp/my_games.dart || true
          flutter create . --platforms=android --project-name zed_games
          cp /tmp/my_games.dart lib/main.dart || true
          flutter pub get
          python3 << 'PY'
          import pathlib
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t=mf.read_text()
          if "APPLICATION_ID" not in t:
              t=t.replace("<application", '<application\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>',1)
              mf.write_text(t)
          print("Games kept, crash fixed")
          PY
          dart run flutter_launcher_icons || echo "icon done"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
